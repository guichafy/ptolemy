name: Release

on:
  push:
    branches: [main]

# Publishes the GitHub release only. The Pages mirror of the zip, latest.json
# and the landing page are published by the Site workflow, which runs after
# this one finishes (workflow_run), so gh-pages has a single publisher.

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

      - name: Detect new release
        id: release
        run: |
          if compgen -G "ptolemy-*-macos-arm64.zip" > /dev/null; then
            VERSION=$(jq -r .version package.json)
            ZIP="ptolemy-${VERSION}-macos-arm64.zip"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Detected release: v${VERSION}"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No release produced this run."
          fi

      # The mirror goes live when the Site workflow (triggered by the end of
      # this run) publishes it, a few minutes from now.
      - name: Annotate release with Pages mirror link
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/v${VERSION}/${{ steps.release.outputs.zip }}"
          gh release view "v${VERSION}" --json body -q .body > /tmp/body.md
          {
            printf '**Download direto (mirror GitHub Pages):** %s\n\n---\n\n' "$URL"
            cat /tmp/body.md
          } > /tmp/new-body.md
          gh release edit "v${VERSION}" --notes-file /tmp/new-body.md
